<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171713">
<title>Liebenburg – rotierendes Wappen</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4efe6;--ink:#2a2118;--muted:#7a6c5a;--map:#e6dfcf;--grid:#d3c9b3;--road:#fffaf0;--hole:#b9ae96;--city:#f8f3e8;--water:#9cc3e0;--red:#b3262e;--silver:#e9e6df;--gold:#c9a227;--line:#2a2118}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130f;--ink:#f1e9da;--muted:#a69882;--map:#262119;--grid:#383124;--road:#3a3326;--hole:#0e0c09;--city:#3b3427;--water:#2d5372;--red:#d23a42;--silver:#d8d4ca;--gold:#e0b93a;--line:#f1e9da}}
:root[data-theme="dark"]{--bg:#16130f;--ink:#f1e9da;--muted:#a69882;--map:#262119;--grid:#383124;--road:#3a3326;--hole:#0e0c09;--city:#3b3427;--water:#2d5372;--red:#d23a42;--silver:#d8d4ca;--gold:#e0b93a;--line:#f1e9da}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem}
h1{margin:0;font-size:clamp(1.3rem,5vw,1.8rem);letter-spacing:.3em;text-transform:uppercase;padding-left:.3em;text-align:center}
.sub{margin:0;color:var(--muted);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;text-align:center}
.map{position:relative;width:min(92vw,480px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.stage{position:absolute;left:12.5%;top:12.5%;width:75%;height:75%;perspective:1000px}
.coin{width:100%;height:100%;animation:spin 8s linear infinite;transform-style:preserve-3d;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.coin svg{width:100%;height:100%;display:block;backface-visibility:visible}
@keyframes spin{to{transform:rotateY(360deg)}}
.tip{position:absolute;left:50%;top:94.7%;width:0;height:0;pointer-events:none}
.bar{position:absolute;top:0;height:6px;border-radius:3px;border:1px solid rgba(128,128,128,.55)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;width:min(92vw,480px)}
.item{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border:1px solid var(--grid);border-radius:10px;opacity:.55;transition:opacity .25s,border-color .25s}
.item.on{opacity:1;border-color:var(--ink)}
.item b{font-size:1.1rem;min-width:1.8rem}
.item small{display:block;color:var(--muted);font-size:.7rem;line-height:1.25}
.chips{display:flex;flex-direction:column;gap:3px}
.chip{display:flex;width:34px;height:8px;border-radius:4px;overflow:hidden;border:1px solid rgba(128,128,128,.55)}
.chip i{flex:1}
.note{width:min(92vw,480px);color:var(--muted);font: .78rem/1.45 system-ui,sans-serif;text-align:center}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1px solid var(--grid);background:var(--map);color:var(--ink);border-radius:9px;padding:.55rem .85rem}
@media(prefers-reduced-motion:reduce){.coin{animation-duration:30s}}
</style>
</head>
<body>
<h1>Liebenburg</h1>
<p class="sub">Gemeindewappen · rotierende Darstellung</p>

<div class="map">
  <svg viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
    <rect width="400" height="400" fill="var(--map)"/>
    <g stroke="var(--grid)" stroke-width="1">
      <path d="M0 50H400M0 100H400M0 150H400M0 200H400M0 250H400M0 300H400M0 350H400M50 0V400M100 0V400M150 0V400M200 0V400M250 0V400M300 0V400M350 0V400"/>
    </g>
    <g stroke="var(--road)" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M0 120 C120 150 260 90 400 130"/>
      <path d="M60 400 C140 260 250 180 340 0"/>
      <path d="M0 300 C140 280 260 340 400 290"/>
    </g>
    <path d="M60 70 L105 49 160 60 205 45 263 75 324 63 356 120 344 180 367 225 335 290 285 320 238 365 177 350 130 365 82 320 48 265 56 205 35 150Z"
      fill="var(--hole)" opacity=".9"/>
  </svg>

  <div class="stage">
    <div class="coin">
      <svg viewBox="0 0 300 300" role="img" aria-label="Schematisch dargestelltes Wappen der Gemeinde Liebenburg">
        <!-- Wappenschild in Rot -->
        <path d="M42 42 H258 V153 C258 219 209 260 150 282 C91 260 42 219 42 153 Z"
          fill="#c92332" stroke="#2a2118" stroke-width="5" stroke-linejoin="round"/>
        <!-- Goldene Burg / Mauer mit Zinnen -->
        <path d="M68 171 V100 H84 V82 H105 V100 H122 V82 H143 V100 H160 V82 H181 V100 H198 V82 H219 V100 H235 V171 Z"
          fill="#e4b52e" stroke="#2a2118" stroke-width="4" stroke-linejoin="round"/>
        <path d="M83 171 V126 H220 V171" fill="#e4b52e" stroke="#2a2118" stroke-width="4"/>
        <path d="M131 171 V143 A19 19 0 0 1 169 143 V171 Z"
          fill="#2a2118" stroke="#2a2118" stroke-width="2"/>
        <!-- Zehnblättrige Rosette als vereinfachtes Symbol -->
        <g transform="translate(150 220)" fill="#e4b52e" stroke="#2a2118" stroke-width="2">
          <ellipse cx="0" cy="-16" rx="6" ry="13"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(36)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(72)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(108)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(144)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(180)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(216)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(252)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(288)"/>
          <ellipse cx="0" cy="-16" rx="6" ry="13" transform="rotate(324)"/>
          <circle r="6" fill="#c92332"/>
        </g>
      </svg>
    </div>
    <div class="tip" id="tip"></div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="controls">
  <button id="pause" type="button">Pause</button>
  <button id="slower" type="button">Langsamer</button>
  <button id="faster" type="button">Schneller</button>
</div>
<p class="note">Schematische Wappenillustration und abstrakte Kartenfläche – keine amtliche Karte oder maßstabsgetreue Wappenzeichnung.</p>

<script>
const PAIRS=[["#d23a42","#111111"],["#ffffff","#111111"],["#ffffff","#f2c500"],["#ffffff","#1f9d55"],["#7b3fa0","#111111"],["#111111","#ffffff"],["#ffffff","#2a6fdb"],["#ffffff","#1f9d55"]];
const MODE="Ri"; // "Ro" = links lang, "Ri" = abwechselnd, "Legende" = Phasenlogik
const NAMES=["Ro","Ra","Ri","Re"];
const TEXT=["links lang","beide gleich lang","abwechselnd","rechts lang"];
const tip=document.getElementById("tip"),legend=document.getElementById("legend");
const SPIN=8000,STEP=SPIN/PAIRS.length;
NAMES.forEach((n,k)=>{
  const chips=[k,k+4].map(i=>'<span class="chip"><i style="background:'+PAIRS[i][0]+'"></i><i style="background:'+PAIRS[i][1]+'"></i></span>').join("");
  legend.insertAdjacentHTML("beforeend",'<div class="item" id="it'+k+'"><b>'+n+'</b><div class="chips">'+chips+'</div><small>'+TEXT[k]+'</small></div>');
});
function emit(i){
  const k=i%4,[a,b]=PAIRS[i],map=tip.closest(".map").clientWidth,long=map*.34,short=long*.35;
  let L,R;
  if(k===0){L=long;R=short}
  else if(k===1){L=R=(long+short)/2}
  else if(k===2){const f=Math.floor(i/4)%2===0;L=f?long:short;R=f?short:long}
  else{L=short;R=long}
  if(MODE==="Ro"){L=long;R=short}
  if(MODE==="Ri"){const f=i%2===0;L=f?long:short;R=f?short:long}
  document.querySelectorAll(".item").forEach((e,j)=>e.classList.toggle("on",j===k));
  const mk=(c,len,side)=>{
    const e=document.createElement("div");e.className="bar";e.style.background=c;e.style.width=len+"px";
    e.style[side==="L"?"right":"left"]="0";e.style.transformOrigin=side==="L"?"right":"left";tip.appendChild(e);
    const y=i*2;
    e.animate([{transform:"translateY("+y+"px) scaleX(0)",opacity:1},{transform:"translateY("+(y+8)+"px) scaleX(1)",opacity:1,offset:.35},{transform:"translateY("+(y+26)+"px) scaleX(1)",opacity:0}],{duration:STEP*2.4,easing:"ease-out"}).onfinish=()=>e.remove();
  };
  mk(a,L,"L");mk(b,R,"R");
}
let n=0,timer=null,delay=STEP;
function start(){if(timer)return;timer=setInterval(()=>emit(n++%8),delay)}
function stop(){clearInterval(timer);timer=null}
function restart(){stop();timer=null;start()}
emit(n++%8);start();
document.getElementById("pause").addEventListener("click",e=>{
 if(timer){stop();e.currentTarget.textContent="Weiter"}else{start();e.currentTarget.textContent="Pause"}
});
document.getElementById("slower").addEventListener("click",()=>{delay=Math.min(4000,delay*1.25);restart()});
document.getElementById("faster").addEventListener("click",()=>{delay=Math.max(250,delay/1.25);restart()});
</script>
</body>
</html>
